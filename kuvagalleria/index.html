                <article class="kortti elaimet">

                        <figcaption id="kuva-1" class="kuvan-tiedot" popover>
                            <h2>Lentävä kuningaskalastaja</h2>

                            <p>Kuningaskalastaja lentää matalalla siivet tiiviisti vartalon lähellä. Sininen selkä ja
                                oranssi vatsapuoli
                                erottuvat pehmeäksi sumentuneesta taustasta.</p>
                            <p>Tekijä: <a href="https://commons.wikimedia.org/wiki/User:Prasan_Shrestha" target="_blank"
                                    rel="noopener noreferrer">Prasan Shrestha</a></p>

                            <p>Kuvauspäivä: <time datetime="2023-12-01">1.12.2023</time></p>
                            <a href="https://commons.wikimedia.org/wiki/File:Common_kingfisher_in_flight.jpg"
                                target="_blank" rel="noopener noreferrer">Alkuperäinen kuva – Wikimedia Commons</a>

                            <p class="lisatiedot"><small>* <a href="https://creativecommons.org/licenses/by-sa/4.0"

                            <h2>Baskimaan kerroksellinen rannikko</h2>

                            <p>Baskimaan rannikon kallioissa erottuvat pitkät, vinoon asettuneet kivikerrokset. Atlantin

                                seuraavat Deban ja Zumaian välisen rantaviivan kaarta.</p>
